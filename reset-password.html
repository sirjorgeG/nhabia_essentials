
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Nhabia Essentials</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    .reset-container {
      max-width: 460px;
      margin: 70px auto;
      padding: 35px;
      background: #fffaf4;
      border: 1px solid #dfcba9;
      border-radius: 12px;
      text-align: center;
    }

    .reset-container h1 {
      color: #4b3026;
      font-size: 30px;
    }

    .reset-container input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 12px 0;
      border: 1px solid #c8ae83;
      border-radius: 5px;
    }

    .reset-container button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      background: #ad874b;
      color: white;
      border: none;
      cursor: pointer;
    }

    .reset-container button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <header>
    <img class="logo" src="assets/logo.png" alt="Nhabia Essentials">
  </header>

  <main class="reset-container">
    <h1>Reset Your Password</h1>

    <p id="instructions">
      Checking your password recovery link...
    </p>

    <form id="resetForm" hidden>
      <label for="newPassword">New password</label>
      <input
        type="password"
        id="newPassword"
        minlength="12"
        autocomplete="new-password"
        required
      >

      <label for="confirmPassword">Confirm new password</label>
      <input
        type="password"
        id="confirmPassword"
        minlength="12"
        autocomplete="new-password"
        required
      >

      <button id="resetButton" type="submit">
        Update Password
      </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>

  <script>
    const form = document.getElementById('resetForm');
    const message = document.getElementById('message');
    const instructions = document.getElementById('instructions');
    const button = document.getElementById('resetButton');

    let recoveryVerified = false;

    function showMessage(text) {
      message.textContent = text;
    }

    async function initialiseRecovery() {
      try {
        if (!window.supabaseClient) {
          throw new Error('Authentication service unavailable.');
        }

        const params = new URLSearchParams(window.location.search);
        const hash = new URLSearchParams(window.location.hash.slice(1));

        const errorDescription =
          params.get('error_description') ||
          hash.get('error_description');

        if (errorDescription) {
          throw new Error(errorDescription);
        }

        // Supabase may redirect using a one-time PKCE code.
        const code = params.get('code');

        if (code) {
          const { error } =
            await supabaseClient.auth.exchangeCodeForSession(code);

          if (error) throw error;
        }

        // Supabase recovery emails can also use token_hash.
        const tokenHash = params.get('token_hash');

        if (tokenHash) {
          const { error } =
            await supabaseClient.auth.verifyOtp({
              token_hash: tokenHash,
              type: 'recovery'
            });

          if (error) throw error;
        }

        // For implicit-flow recovery links, Supabase JS
        // processes the tokens in the URL automatically.
        if (hash.has('access_token')) {
          const accessToken = hash.get('access_token');
          const refreshToken = hash.get('refresh_token');

          if (!accessToken || !refreshToken) {
            throw new Error('Incomplete recovery link.');
          }

          const { error } =
            await supabaseClient.auth.setSession({
              access_token: accessToken,
              refresh_token: refreshToken
            });

          if (error) throw error;
        }

        const hasRecoveryLink =
          Boolean(code || tokenHash || hash.has('access_token'));

        if (!hasRecoveryLink) {
          throw new Error(
            'Open this page using a new password recovery email.'
          );
        }

        const { data, error } =
          await supabaseClient.auth.getUser();

        if (error || !data.user) {
          throw new Error(
            'Recovery link is invalid or has expired.'
          );
        }

        recoveryVerified = true;
        form.hidden = false;
        instructions.textContent =
          'Enter and confirm your new password.';

        // Remove tokens from the visible browser address.
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );

      } catch (error) {
        showMessage(error.message);
        instructions.textContent =
          'Unable to verify the recovery link.';
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      if (!recoveryVerified) return;

      const password =
        document.getElementById('newPassword').value;

      const confirmation =
        document.getElementById('confirmPassword').value;

      if (password !== confirmation) {
        showMessage('Passwords do not match.');
        return;
      }

      if (password.length < 12) {
        showMessage('Use at least 12 characters.');
        return;
      }

      button.disabled = true;
      showMessage('Updating password...');

      const { error } =
        await supabaseClient.auth.updateUser({
          password: password
        });

      if (error) {
        showMessage(error.message);
        button.disabled = false;
        return;
      }

      form.hidden = true;
      showMessage(
        'Password updated successfully. You can now sign in.'
      );

      await supabaseClient.auth.signOut();
    });

    initialiseRecovery();
  </script>
</body>
</html>
